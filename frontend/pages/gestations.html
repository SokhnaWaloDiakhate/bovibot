<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BoviBot - Gestations</title>
  <link rel="stylesheet" href="../css/style.css?v=5" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    .filter-tabs { display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; }
    .ftab { padding: 8px 18px; border-radius: 30px; border: 1.5px solid var(--border); background: #fff; font-family: var(--font-body); font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 8px; }
    .ftab.active { background: var(--accent-green); color: #fff; border-color: var(--accent-green); box-shadow: 0 4px 10px rgba(76, 175, 130, 0.3); }
    .gestations-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 20px; }
    .gest-card { background: #fff; border-radius: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; border: 1px solid rgba(0,0,0,0.03); }
    .gest-header { padding: 20px; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid #f8f8f8; }
    .gest-avatar { width: 44px; height: 44px; border-radius: 50%; background: #E8F7EF; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .gest-avatar svg { width: 24px; height: 24px; stroke: #2E7D55; stroke-width: 2; fill: none; }
    .gest-title { flex: 1; }
    .gest-tag { font-size: 10px; font-weight: 800; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 2px; }
    .gest-name { font-size: 16px; font-weight: 700; color: var(--text-primary); }
    .gest-badge { font-size: 10px; font-weight: 700; padding: 4px 12px; border-radius: 30px; background: #FEF7E8; color: #9A6000; }
    .gest-badge.imminent { background: #FDEEEE; color: #C0392B; }
    .gest-body { padding: 20px; display: flex; flex-direction: column; gap: 18px; }
    .progress-track { height: 8px; background: #F0F4F0; border-radius: 10px; overflow: hidden; }
    .progress-bar { height: 100%; border-radius: 10px; transition: width 0.8s ease-out; }
    .details-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .detail-label { font-size: 10px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 4px; }
    .detail-val { font-size: 13px; font-weight: 600; color: var(--text-primary); }
    .gest-alert { background: #FEF7E8; border-radius: 10px; padding: 12px 16px; display: flex; align-items: center; gap: 10px; font-size: 12.5px; font-weight: 600; color: #9A6000; }
    .gest-alert.good { background: #E8F7EF; color: #2E7D55; }
    .gest-footer { padding: 15px 20px; background: #fff; border-top: 1px solid #f8f8f8; display: flex; gap: 10px; }
    .btn-gest { flex: 1; padding: 10px; border-radius: 10px; font-family: var(--font-body); font-size: 12.5px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-view { background: #fff; border: 1.5px solid var(--border); color: var(--text-primary); }
    .btn-alert-create { background: var(--accent-green); border: none; color: #fff; }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-logo">
      <svg viewBox="0 0 24 24" style="width:24px;height:24px;stroke:var(--accent-green);stroke-width:2.5;fill:none;margin-right:10px;"><path d="M12 21l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.18L12 21z"></path></svg>
      BoviBot
    </div>
    <nav class="sidebar-nav">
      <a href="../index.html" class="nav-item ">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg></span>
        Dashboard
      </a>
      <a href="chat.html" class="nav-item ">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg></span>
        Assistant IA
      </a>
      <a href="animaux.html" class="nav-item ">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="9" cy="7" r="4"></circle><circle cx="15" cy="7" r="4"></circle><path d="M12 15c-4 0-7 2-7 6h14c0-4-3-6-7-6z"></path></svg></span>
        Animaux
      </a>
      <a href="gestations.html" class="nav-item active">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M7 16.3c2.2 0 4-1.8 4-4s-1.8-4-4-4-4 1.8-4 4 1.8 4 4 4z"></path><path d="M10 7c0-2.2-1.8-4-4-4S2 4.8 2 7"></path><path d="M22 7c0-2.2-1.8-4-4-4s-4 1.8-4 4"></path><path d="M18 16.3c2.2 0 4-1.8 4-4s-1.8-4-4-4-4 1.8-4 4 1.8 4 4 4z"></path></svg></span>
        Gestations
      </a>
      <a href="alertes.html" class="nav-item ">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg></span>
        Alertes <span class="badge" id="badge-nb">--</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar" style="background:#4CAF82">OD</div>
        <div>
          <div class="user-name">Ousmane Diallo</div>
          <div class="user-role">Frontend Dev / Gerant</div>
        </div>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1 class="page-title">Suivi des Gestations</h1>
        <span class="page-date" id="today-date"></span>
      </div>
    </header>
    <div class="filter-tabs">
      <button class="ftab active" onclick="filtrer('toutes', this)">Toutes</button>
      <button class="ftab" onclick="filtrer('imminent', this)">! Imminentes (<7j)</button>
      <button class="ftab" onclick="filtrer('mois', this)">[#] Ce mois</button>
      <button class="ftab" onclick="filtrer('normal', this)">[V] Normales</button>
    </div>
    <div class="gestations-grid" id="gestations-grid"></div>
  </main>
  <script src="../js/gestations.js"></script>
</body>
</html>
