<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BoviBot — Animaux</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    .filters { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .filter-btn {
      padding: 6px 16px; border-radius: 20px; border: 1.5px solid var(--border);
      background: #fff; font-family: var(--font-body); font-size: 12px;
      cursor: pointer; font-weight: 500; transition: all 0.18s;
    }
    .filter-btn.active, .filter-btn:hover {
      background: var(--accent-green); color: #fff; border-color: var(--accent-green);
    }
    .search-input {
      padding: 8px 14px; border-radius: 10px; border: 1.5px solid var(--border);
      font-family: var(--font-body); font-size: 13px; outline: none;
      min-width: 220px;
    }
    .search-input:focus { border-color: var(--accent-green); }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-logo">
      <span class="logo-icon">🐄</span>
      <span class="logo-text">Bovi<strong>Bot</strong></span>
    </div>
    <nav class="sidebar-nav">
     <a href="../index.html"   class="nav-item"><span class="nav-icon">⊞</span> Dashboard</a>
     <a href="chat.html"       class="nav-item"><span class="nav-icon">💬</span> Assistant IA</a>
     <a href="animaux.html"    class="nav-item active"><span class="nav-icon">🐃</span> Animaux</a>
     <a href="gestations.html" class="nav-item"><span class="nav-icon">🍼</span> Gestations</a>
     <a href="alertes.html"    class="nav-item"><span class="nav-icon">🔔</span> Alertes <span class="badge">3</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar">OD</div>
        <div><div class="user-name">Ousmane Diallo</div><div class="user-role">Frontend Dev</div></div>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <h1 class="page-title">Animaux du troupeau</h1>
        <span class="page-date" id="today-date"></span>
      </div>
    </header>

    <div class="panel">
      <div class="filters">
        <input type="text" class="search-input" id="search" placeholder="🔍 Rechercher un tag, race…" oninput="filtrer()"/>
        <button class="filter-btn active" onclick="setFiltre('tous', this)">Tous</button>
        <button class="filter-btn" onclick="setFiltre('actif', this)">Actifs</button>
        <button class="filter-btn" onclick="setFiltre('malade', this)">Malades</button>
        <button class="filter-btn" onclick="setFiltre('vendu', this)">Vendus</button>
      </div>

      <table class="data-table">
        <thead>
          <tr>
            <th>Tag</th><th>Nom</th><th>Race</th><th>Sexe</th>
            <th>Âge</th><th>Poids actuel</th><th>GMQ</th><th>Statut</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </main>

  <script>
    document.getElementById("today-date").textContent = new Date().toLocaleDateString("fr-FR", {weekday:"long",year:"numeric",month:"long",day:"numeric"});

    let animaux = [];
    let filtreActif = "tous";

    // URL du backend avec cache-busting pour forcer la mise à jour
    const API_URL = "/api/animaux?v=" + new Date().getTime();

    async function chargerAnimaux() {
      const tbody = document.getElementById("tbody");
      tbody.innerHTML = "<tr><td colspan='8' style='text-align:center;padding:40px;'>🔍 Chargement des animaux depuis la base de données...</td></tr>";
      
      try {
        const res = await fetch(API_URL);
        animaux = await res.json();
        console.log("Animaux reçus du backend:", animaux);
        
        if (animaux.length === 0) {
          tbody.innerHTML = "<tr><td colspan='8' style='text-align:center;padding:40px;'>❌ Aucun animal trouvé dans la base de données.</td></tr>";
        } else {
          afficher();
        }
      } catch (err) {
        console.error("Erreur chargement animaux:", err);
        tbody.innerHTML = "<tr><td colspan='8' style='text-align:center;padding:40px;color:#E05C5C;'>❌ Erreur de connexion au serveur.</td></tr>";
      }
    }

    function setFiltre(val, btn) {
      filtreActif = val;
      document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      afficher();
    }

    function filtrer() { afficher(); }

    function afficher() {
      const search = document.getElementById("search").value.toLowerCase();
      const tbody = document.getElementById("tbody");
      if (!tbody) return;
      tbody.innerHTML = "";

      animaux
        .filter(a => filtreActif === "tous" || a.statut === filtreActif)
        .filter(a => {
            const nomString = (a.nom || "").toLowerCase();
            const tagString = (a.tag || "").toLowerCase();
            return nomString.includes(search) || tagString.includes(search);
        })
        .forEach(a => {
          const gmqVal = parseFloat(a.gmq || 0).toFixed(2);
          const gmqStyle = gmqVal < 0.3 ? "color:#E05C5C;font-weight:700" : "";
          const displayTag = a.tag && a.tag !== "" ? a.tag : "SANS TAG";
          const displayNom = a.nom || "-";
          const displayRace = a.race || "-";
          const displayAge = a.age_mois != null ? `${a.age_mois} mois` : "-";
          const displayPoids = a.poids_actuel != null ? `${a.poids_actuel} kg` : "-";
          const displayStatut = a.statut || "actif";
          
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td><span class="tag-pill">${displayTag}</span></td>
            <td>${displayNom}</td>
            <td>${displayRace}</td>
            <td>${a.sexe === "M" ? "♂ Mâle" : a.sexe === "F" ? "♀ Femelle" : "-"}</td>
            <td>${displayAge}</td>
            <td>${displayPoids}</td>
            <td style="${gmqStyle}">${gmqVal} kg/j</td>
            <td><span class="statut-badge ${displayStatut}">${displayStatut}</span></td>
          `;
          tbody.appendChild(tr);
        });
    }

    chargerAnimaux();
  </script>
</body>
</html>
