<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BoviBot — Animaux</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    .filters { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .filter-btn {
      padding: 6px 16px; border-radius: 20px; border: 1.5px solid var(--border);
      background: #fff; font-family: var(--font-body); font-size: 12px;
      cursor: pointer; font-weight: 500; transition: all 0.18s;
    }
    .filter-btn.active, .filter-btn:hover {
      background: var(--accent-green); color: #fff; border-color: var(--accent-green);
    }
    .search-input {
      padding: 8px 14px; border-radius: 10px; border: 1.5px solid var(--border);
      font-family: var(--font-body); font-size: 13px; outline: none;
      min-width: 220px;
    }
    .search-input:focus { border-color: var(--accent-green); }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-logo">
      <span class="logo-icon">🐄</span>
      <span class="logo-text">Bovi<strong>Bot</strong></span>
    </div>
    <nav class="sidebar-nav">
     <a href="../index.html"   class="nav-item"><span class="nav-icon">⊞</span> Dashboard</a>
     <a href="chat.html"       class="nav-item"><span class="nav-icon">💬</span> Assistant IA</a>
     <a href="animaux.html"    class="nav-item active"><span class="nav-icon">🐃</span> Animaux</a>
     <a href="gestations.html" class="nav-item"><span class="nav-icon">🍼</span> Gestations</a>
     <a href="alertes.html"    class="nav-item"><span class="nav-icon">🔔</span> Alertes <span class="badge">3</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar">OD</div>
        <div><div class="user-name">Ousmane Diallo</div><div class="user-role">Frontend Dev</div></div>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <h1 class="page-title">Animaux du troupeau</h1>
        <span class="page-date" id="today-date"></span>
      </div>
    </header>

    <div class="panel">
      <div class="filters">
        <input type="text" class="search-input" id="search" placeholder="🔍 Rechercher un tag, race…" oninput="filtrer()"/>
        <button class="filter-btn active" onclick="setFiltre('tous', this)">Tous</button>
        <button class="filter-btn" onclick="setFiltre('actif', this)">Actifs</button>
        <button class="filter-btn" onclick="setFiltre('malade', this)">Malades</button>
        <button class="filter-btn" onclick="setFiltre('vendu', this)">Vendus</button>
      </div>

      <table class="data-table">
        <thead>
          <tr>
            <th>Tag</th><th>Nom</th><th>Race</th><th>Sexe</th>
            <th>Âge</th><th>Poids actuel</th><th>GMQ</th><th>Statut</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </main>

  <script>
    document.getElementById("today-date").textContent = new Date().toLocaleDateString("fr-FR", {weekday:"long",year:"numeric",month:"long",day:"numeric"});

    const animaux = [
      { tag:"TAG-001", nom:"Baaba",  race:"Zébu Gobra", sexe:"M", age:"18 mois", poids:"325 kg", gmq:0.52, statut:"actif" },
      { tag:"TAG-002", nom:"Fatou",  race:"Ndama",      sexe:"F", age:"24 mois", poids:"280 kg", gmq:0.45, statut:"actif" },
      { tag:"TAG-003", nom:"Rama",   race:"Zébu Gobra", sexe:"F", age:"36 mois", poids:"410 kg", gmq:0.60, statut:"actif" },
      { tag:"TAG-004", nom:"Samba",  race:"Métis",      sexe:"M", age:"10 mois", poids:"145 kg", gmq:0.48, statut:"actif" },
      { tag:"TAG-005", nom:"Aïda",   race:"Ndama",      sexe:"F", age:"48 mois", poids:"350 kg", gmq:0.35, statut:"vendu" },
      { tag:"TAG-006", nom:"Modou",  race:"Zébu Gobra", sexe:"M", age:"8 mois",  poids:"88 kg",  gmq:0.18, statut:"malade" },
      { tag:"TAG-007", nom:"Dior",   race:"Ndama",      sexe:"F", age:"4 mois",  poids:"52 kg",  gmq:0.25, statut:"malade" },
      { tag:"TAG-008", nom:"Lamine", race:"Métis",      sexe:"M", age:"20 mois", poids:"295 kg", gmq:0.51, statut:"actif" },
      { tag:"TAG-012", nom:"Khadija",race:"Métis",      sexe:"F", age:"30 mois", poids:"310 kg", gmq:0.38, statut:"actif" },
      { tag:"TAG-019", nom:"Omar",   race:"Zébu Gobra", sexe:"M", age:"12 mois", poids:"190 kg", gmq:0.41, statut:"malade" },
    ];

    let filtreActif = "tous";

    function setFiltre(val, btn) {
      filtreActif = val;
      document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      afficher();
    }

    function filtrer() { afficher(); }

    function afficher() {
      const search = document.getElementById("search").value.toLowerCase();
      const tbody = document.getElementById("tbody");
      tbody.innerHTML = "";

      animaux
        .filter(a => filtreActif === "tous" || a.statut === filtreActif)
        .filter(a => a.tag.toLowerCase().includes(search) || a.race.toLowerCase().includes(search) || a.nom.toLowerCase().includes(search))
        .forEach(a => {
          const gmqStyle = a.gmq < 0.3 ? "color:#E05C5C;font-weight:700" : "";
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td><span class="tag-pill">${a.tag}</span></td>
            <td>${a.nom}</td>
            <td>${a.race}</td>
            <td>${a.sexe === "M" ? "♂ Mâle" : "♀ Femelle"}</td>
            <td>${a.age}</td>
            <td>${a.poids}</td>
            <td style="${gmqStyle}">${a.gmq} kg/j</td>
            <td><span class="statut-badge ${a.statut}">${a.statut}</span></td>
          `;
          tbody.appendChild(tr);
        });
    }

    afficher();
  </script>
</body>
</html>
