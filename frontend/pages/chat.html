<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BoviBot - Assistant IA</title>
  <link rel="stylesheet" href="../css/style.css?v=6"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    .chat-container { display: flex; flex-direction: column; height: calc(100vh - 40px); background: #fff; border-radius: 24px; box-shadow: var(--shadow); overflow: hidden; border: 1px solid rgba(0,0,0,0.05); }
    .chat-header { padding: 20px 30px; border-bottom: 1px solid rgba(0,0,0,0.05); display: flex; align-items: center; justify-content: space-between; background: #fff; }
    .chat-header-info { display: flex; align-items: center; gap: 15px; }
    .bot-avatar { width: 45px; height: 45px; border-radius: 14px; background: var(--accent-green); display: flex; align-items: center; justify-content: center; font-size: 22px; }
    .bot-status { font-size: 11px; color: #4CAF50; font-weight: 700; display: flex; align-items: center; gap: 5px; margin-top: 2px; }
    .bot-status::before { content: ""; width: 7px; height: 7px; background: #4CAF50; border-radius: 50%; display: inline-block; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 30px; display: flex; flex-direction: column; gap: 20px; background: #fafafa; }
    .msg { display: flex; gap: 15px; max-width: 85%; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg-avatar { width: 36px; height: 36px; border-radius: 50%; background: #eee; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
    .msg.bot .msg-avatar { background: var(--accent-green); color: #fff; }
    .msg-bubble { padding: 14px 20px; border-radius: 18px; font-size: 14.5px; line-height: 1.5; box-shadow: 0 2px 5px rgba(0,0,0,0.02); background: #fff; color: var(--text-primary); border-top-left-radius: 4px; }
    .msg.user .msg-bubble { background: var(--accent-green); color: #fff; border-top-right-radius: 4px; border-top-left-radius: 18px; }
    .chat-input-area { padding: 20px 30px; background: #fff; border-top: 1px solid rgba(0,0,0,0.05); display: flex; gap: 15px; align-items: center; }
    .chat-input { flex: 1; padding: 15px 25px; border-radius: 30px; border: 2px solid #f0f0f0; background: #f9f9f9; font-family: inherit; font-size: 14.5px; transition: all 0.2s; resize: none; max-height: 100px; }
    .btn-send { width: 50px; height: 50px; border-radius: 50%; background: var(--accent-green); border: none; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; box-shadow: 0 4px 12px rgba(76,175,130,0.3); }
    .confirm-box { margin-top: 10px; background: #fff; border: 2px solid var(--accent-amber); border-radius: 12px; padding: 15px; }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-logo">
      <svg viewBox="0 0 24 24" style="width:24px;height:24px;stroke:var(--accent-green);stroke-width:2.5;fill:none;margin-right:10px;"><path d="M12 21l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.18L12 21z"></path></svg>
      BoviBot
    </div>
    <nav class="sidebar-nav">
      <a href="../index.html" class="nav-item">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg></span>
        Dashboard
      </a>
      <a href="chat.html" class="nav-item active">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg></span>
        Assistant IA
      </a>
      <a href="animaux.html" class="nav-item">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="9" cy="7" r="4"></circle><circle cx="15" cy="7" r="4"></circle><path d="M12 15c-4 0-7 2-7 6h14c0-4-3-6-7-6z"></path></svg></span>
        Animaux
      </a>
      <a href="gestations.html" class="nav-item">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M7 16.3c2.2 0 4-1.8 4-4s-1.8-4-4-4-4 1.8-4 4 1.8 4 4 4z"></path><path d="M10 7c0-2.2-1.8-4-4-4S2 4.8 2 7"></path><path d="M22 7c0-2.2-1.8-4-4-4s-4 1.8-4 4"></path><path d="M18 16.3c2.2 0 4-1.8 4-4s-1.8-4-4-4-4 1.8-4 4 1.8 4 4 4z"></path></svg></span>
        Gestations
      </a>
      <a href="alertes.html" class="nav-item">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg></span>
        Alertes
      </a>
    </nav>
  </aside>
  <main class="main">
    <div class="chat-container">
      <header class="chat-header">
        <div class="chat-header-info"><div class="bot-avatar">??</div><div><div style="font-weight: 800; font-family: var(--font-display);">BoviBot Assistant</div><div class="bot-status">En ligne</div></div></div>
        <button class="btn-traiter" onclick="location.reload()" style="background:#f9f9f9;border-color:#eee;color:#666">Nouveau Chat</button>
      </header>
      <div class="chat-messages" id="chat-messages">
        <div class="msg bot"><div class="msg-avatar">??</div><div class="msg-bubble">Bonjour Ousmane ! Je suis votre assistant BoviBot. Posez-moi n'importe quelle question sur vos animaux.</div></div>
      </div>
      <div class="chat-input-area">
        <textarea class="chat-input" id="chat-input" placeholder="Demandez quelque chose..." rows="1"></textarea>
        <button class="btn-send" id="chat-send"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"></path></svg></button>
      </div>
    </div>
  </main>
  <script src="../js/chat.js?v=10"></script>
</body>
</html>
