<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BoviBot - Alertes</title>
  <link rel="stylesheet" href="../css/style.css?v=6"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    .alertes-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 24px; }
    .alerte-stat-card { background: #fff; border-radius:18px; padding: 20px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 16px; border-left: 4px solid var(--c); border: 1px solid rgba(0,0,0,0.03); }
    .alerte-stat-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: var(--bg-c); }
    .alerte-stat-icon svg { width: 22px; height: 22px; stroke: var(--c); stroke-width: 2; fill: none; }
    .alerte-stat-val { font-family: var(--font-display); font-size: 32px; font-weight: 800; line-height: 1; color: var(--text-primary); }
    .alerte-stat-label { font-size: 11px; color: var(--text-secondary); font-weight: 600; text-transform: uppercase; margin-top: 4px; }

    .alertes-container { display: flex; flex-direction: column; gap: 12px; }
    .alerte-card { background: #fff; border-radius: 16px; padding: 20px 24px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 18px; border-left: 4px solid var(--c); transition: all 0.2s; border: 1px solid rgba(0,0,0,0.03); }
    .alerte-card:hover { transform: translateX(4px); box-shadow: 0 8px 25px rgba(0,0,0,0.05); }
    .alerte-card-body { flex: 1; }
    .alerte-level-badge { display: inline-block; padding: 3px 10px; border-radius: 30px; font-size: 10px; font-weight: 800; text-transform: uppercase; margin-bottom: 8px; color: #fff; background: var(--c); }
    .alerte-card-msg { font-size: 14.5px; font-weight: 700; color: var(--text-primary); margin-bottom: 6px; line-height: 1.4; }
    .alerte-card-meta { font-size: 11.5px; color: var(--text-secondary); font-weight: 500; display: flex; align-items: center; gap: 10px; }
    
    .btn-traiter { padding: 9px 20px; border-radius: 10px; border: 1.5px solid var(--accent-green); background: transparent; color: var(--accent-green); font-family: var(--font-body); font-size: 12.5px; font-weight: 800; cursor: pointer; transition: all 0.2s; }
    .btn-traiter:hover { background: var(--accent-green); color: #fff; box-shadow: 0 4px 12px rgba(76,175,130,0.3); }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-logo">
      <svg viewBox="0 0 24 24" style="width:24px;height:24px;stroke:var(--accent-green);stroke-width:2.5;fill:none;margin-right:10px;"><path d="M12 21l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.18L12 21z"></path></svg>
      BoviBot
    </div>
    <nav class="sidebar-nav">
      <a href="../index.html" class="nav-item">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg></span>
        Dashboard
      </a>
      <a href="chat.html" class="nav-item">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg></span>
        Assistant IA
      </a>
      <a href="animaux.html" class="nav-item">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="9" cy="7" r="4"></circle><circle cx="15" cy="7" r="4"></circle><path d="M12 15c-4 0-7 2-7 6h14c0-4-3-6-7-6z"></path></svg></span>
        Animaux
      </a>
      <a href="gestations.html" class="nav-item">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M7 16.3c2.2 0 4-1.8 4-4s-1.8-4-4-4-4 1.8-4 4 1.8 4 4 4z"></path><path d="M10 7c0-2.2-1.8-4-4-4S2 4.8 2 7"></path><path d="M22 7c0-2.2-1.8-4-4-4s-4 1.8-4 4"></path><path d="M18 16.3c2.2 0 4-1.8 4-4s-1.8-4-4-4-4 1.8-4 4 1.8 4 4 4z"></path></svg></span>
        Gestations
      </a>
      <a href="alertes.html" class="nav-item active">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg></span>
        Alertes <span class="badge" id="badge-nb">--</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar" style="background:#4CAF82">OD</div>
        <div>
          <div class="user-name">Ousmane Diallo</div>
          <div class="user-role">Frontend Dev / Gerant</div>
        </div>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1 class="page-title">Alertes systeme</h1>
        <span class="page-date" id="today-date"></span>
      </div>
    </header>

    <div class="alertes-stats">
      <div class="alerte-stat-card" style="--c:#E05C5C; --bg-c:#FEF0F0">
        <div class="alerte-stat-icon"><svg viewBox="0 0 24 24"><path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg></div>
        <div><div class="alerte-stat-val" id="count-critical">0</div><div class="alerte-stat-label">Critiques</div></div>
      </div>
      <div class="alerte-stat-card" style="--c:#F0A030; --bg-c:#FEF7E8">
        <div class="alerte-stat-icon"><svg viewBox="0 0 24 24"><path d="M12 8v4m0 4h.01M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"></path></svg></div>
        <div><div class="alerte-stat-val" id="count-warning">0</div><div class="alerte-stat-label">Attention</div></div>
      </div>
      <div class="alerte-stat-card" style="--c:#5BA4F5; --bg-c:#EEF6FF">
        <div class="alerte-stat-icon"><svg viewBox="0 0 24 24"><path d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"></path></svg></div>
        <div><div class="alerte-stat-val" id="count-info">0</div><div class="alerte-stat-label">Infos</div></div>
      </div>
      <div class="alerte-stat-card" style="--c:#4CAF82; --bg-c:#EDF7F2">
        <div class="alerte-stat-icon"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"></path></svg></div>
        <div><div class="alerte-stat-val" id="count-traitees">0</div><div class="alerte-stat-label">Traitees</div></div>
      </div>
    </div>

    <div class="alertes-container" id="alertes-container">
      <div style="text-align:center; padding:40px; color:var(--text-secondary);">Chargement des alertes...</div>
    </div>
  </main>

  <script>
    let alertes = [];
    document.getElementById("today-date").textContent = new Date().toLocaleDateString("fr-FR", { weekday: "long", year: "numeric", month: "long", day: "numeric" });

    async function chargerAlertes() {
      try {
        const [resA, resS] = await Promise.all([
          fetch("/alertes"),
          fetch("/stats")
        ]);
        alertes = await resA.json();
        const stats = await resS.json();
        document.getElementById("count-traitees").textContent = stats.alertes_traitees || 0;
        afficher();
      } catch (err) {
        console.error("Erreur:", err);
        document.getElementById("alertes-container").innerHTML = '<div style="text-align:center;color:red;padding:40px;">Serveur deconnecte.</div>';
      }
    }

    function afficher() {
      const container = document.getElementById("alertes-container");
      container.innerHTML = "";
      const counts = { critical: 0, warning: 0, info: 0 };
      const labels = { critical: "URGENT / CRITIQUE", warning: "ATTENTION", info: "INFORMATION" };

      if (alertes.length === 0) {
        container.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-secondary);">Aucune alerte active.</div>';
      } else {
        alertes.forEach(a => {
          if (counts[a.niveau] !== undefined) counts[a.niveau]++;
          const colors = { critical: "#E05C5C", warning: "#F0A030", info: "#5BA4F5" };
          const col = colors[a.niveau] || "#ccc";
          const card = document.createElement("div");
          card.className = "alerte-card";
          card.style.cssText = `--c: ${col}`;
          card.innerHTML = `
            <div class="alerte-card-body">
              <span class="alerte-level-badge">${labels[a.niveau] || "ALERTE"}</span>
              <div class="alerte-card-msg">${a.message}</div>
              <div class="alerte-card-meta">
                <span>[#] ID: ${a.id}</span>
                <span>•</span>
                <span>${new Date(a.date_creation).toLocaleString()}</span>
              </div>
            </div>
            <button class="btn-traiter" onclick="traiter(${a.id})">Marquer comme traite</button>
          `;
          container.appendChild(card);
        });
      }

      document.getElementById("count-critical").textContent = counts.critical;
      document.getElementById("count-warning").textContent = counts.warning;
      document.getElementById("count-info").textContent = counts.info;
      document.getElementById("badge-nb").textContent = alertes.length;
    }

    async function traiter(id) {
      try {
        await fetch(`/api/alertes/${id}/traiter`, { method: "POST" });
        alertes = alertes.filter(a => a.id !== id);
        afficher();
      } catch (err) { console.error("Erreur traitement:", err); }
    }

    window.onload = chargerAlertes;
  </script>
</body>
</html>
